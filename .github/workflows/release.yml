name: release

# Manual only: the fxrelease command on your phone, or Actions -> release -> Run workflow.
# It builds main, signs the APK with the release key automatically, and leaves a DRAFT release that
# only you can see. Nothing is public until you publish that draft (fxpromote). No tag exists until then.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, like 1.0.0 (must equal versionName in app/build.gradle.kts)'
        required: true
        type: string

permissions: {}               # nothing by default; each job asks for only what it needs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30       # the default is 360; a stuck build must not run for hours
    permissions:
      contents: read          # also lets this job download the data release
    env:
      VERSION: ${{ inputs.version }}   # always read through the environment, never pasted into a script
    steps:
      - name: Only main may build a release
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "Releases are built from main only (this run is on $GITHUB_REF)"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          [ "$FILE" = "$VERSION" ] || { echo "versionName in app/build.gradle.kts is '$FILE' but you asked for '$VERSION'. Change it, push, then run again."; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released. Releases are immutable, so use the next version."; exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true   # caches can be poisoned; release builds start clean

      # dictionary.db is too big for git. It is a release asset named in dictionary-db.txt
      # ("data-v3 <sha256>"), and the build refuses anything whose checksum differs.
      - name: Fetch and verify dictionary database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r TAG SHA EXTRA < dictionary-db.txt
          [[ "$TAG" =~ ^data-v[0-9]+$ ]]  || { echo "dictionary-db.txt: bad tag '$TAG'"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{64}$ ]]  || { echo "dictionary-db.txt: SHA must be 64 lowercase hex characters, with no file name after it"; exit 1; }
          [ -z "${EXTRA:-}" ]             || { echo "dictionary-db.txt: unexpected extra text"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern dictionary.db --output dictionary.db
          echo "$SHA  dictionary.db" | sha256sum -c -
          head -c 15 dictionary.db | grep -q 'SQLite format 3' || { echo "dictionary.db is not an SQLite file"; exit 1; }
          ls -l dictionary.db

      - run: ./gradlew assembleRelease --no-daemon --stacktrace -PdictionaryDb="$PWD/dictionary.db"

      - name: Sanity check APK size
        run: |
          set -euo pipefail
          SIZE=$(stat -c%s app/build/outputs/apk/release/*-unsigned.apk)
          echo "APK size: $SIZE bytes"
          [ "$SIZE" -gt 15000000 ] || { echo "APK is too small, so the database is probably missing"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release        # unlocks the secrets, and only for runs on main
    permissions: {}             # this job cannot touch your repo at all
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-apk
          path: unsigned
      - name: Sign and verify
        env:
          VERSION: ${{ inputs.version }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          EXPECTED: ${{ vars.CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          KS="$RUNNER_TEMP/release.p12"
          OUT="fixionary-v${VERSION}.apk"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          "$APKSIGNER" sign --ks "$KS" --ks-key-alias fixionary \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out "$OUT" unsigned/*-unsigned.apk
          GOT="$("$APKSIGNER" verify --print-certs "$OUT" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')"
          echo "Signed with: $GOT"
          [ "$GOT" = "$EXPECTED" ] || { echo "Fingerprint mismatch, aborting"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk
          path: fixionary-*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: sign
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write       # create the draft release
      id-token: write       # needed for attestation
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-apk
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.apk
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          # Running the same version again replaces the old draft instead of piling up copies.
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                      --jq ".[] | select(.draft and .tag_name==\"v$VERSION\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
            --target "$GITHUB_SHA" --title "Fixionary $VERSION" --generate-notes \
            dist/*.apk dist/SHA256SUMS.txt
          # A draft must not create the tag. If this ever fires, stop and tell me before publishing anything.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::GitHub created the tag v$VERSION as soon as the draft was made. Do not publish; see the guide."; exit 1
          fi
          echo "Draft v$VERSION is ready. Test it, then run fxpromote $VERSION or fxdiscard $VERSION."
